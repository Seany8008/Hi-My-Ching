<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi My Ching! ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 50%, #f8bbd0 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #4a4a4a;
    }

    /* Falling Background Glitter */
    .glitter {
      position: absolute;
      top: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.2) 70%);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      animation: fall linear infinite, strobe 1.5s ease-in-out infinite alternate;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    @keyframes strobe {
      0% { opacity: 0.2; box-shadow: 0 0 2px rgba(255, 255, 255, 0.5); }
      100% { opacity: 1; box-shadow: 0 0 10px rgba(255, 255, 255, 1); }
    }

    /* Container Card */
    .container {
      position: relative;
      width: 330px;
      min-height: 520px;
      background: rgba(255, 240, 245, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(219, 112, 147, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      z-index: 10;
      transition: all 0.5s ease-in-out;
    }

    /* Greeting Section */
    .greeting-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .greeting-box h1 {
      font-size: 2.2rem;
      color: #d81b60;
      margin-bottom: 25px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .open-btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 14px 45px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
      transition: all 0.3s ease;
      margin-bottom: 25px;
    }

    .open-btn:active {
      transform: scale(0.95);
      background: #c2185b;
    }

    /* GIF Styling below the button */
    .greeting-gif {
      width: 180px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 8px 18px rgba(219, 112, 147, 0.2);
      pointer-events: none;
    }

    /* Passcode Section */
    .passcode-box {
      display: none;
      opacity: 0;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.5s ease;
    }

    .passcode-title {
      font-size: 1.1rem;
      color: #ad1457;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #e91e63;
      height: 20px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* iPhone Dot Indicators */
    .dots-container {
      display: flex;
      gap: 14px;
      margin-bottom: 30px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border: 1.5px solid #d81b60;
      border-radius: 50%;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .dot.filled {
      background-color: #d81b60;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 20px;
      justify-items: center;
    }

    .key-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid rgba(216, 27, 96, 0.2);
      background: rgba(255, 255, 255, 0.5);
      color: #880e4f;
      font-size: 1.5rem;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .key-btn:active {
      background: rgba(216, 27, 96, 0.25);
      transform: scale(0.92);
    }

    .key-btn.empty {
      visibility: hidden;
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <!-- Greeting Screen -->
    <div class="greeting-box" id="greetingBox">
      <h1>Hi My Ching!</h1>
      <button class="open-btn" onclick="showPasscodeScreen()">Open</button>
      
      <!-- Cute Tenor GIF Below Open Button -->
      <img src="snoopy-cute.gif" alt="Cute GIF" class="greeting-gif">
    </div>

    <!-- Passcode Screen -->
    <div class="passcode-box" id="passcodeBox">
      <div class="passcode-title">Enter Passcode</div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="dots-container" id="dotsContainer">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <div class="key-btn empty"></div>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="deleteKey()">⌫</button>
      </div>
    </div>
  </div>

  <script>
    const CORRECT_PASSCODE = "021609";
    let enteredCode = "";

    // Generate falling glitter
    for (let i = 0; i < 35; i++) {
      const glitter = document.createElement('div');
      glitter.classList.add('glitter');
      const size = Math.random() * 4 + 3;
      glitter.style.width = size + 'px';
      glitter.style.height = size + 'px';
      glitter.style.left = Math.random() * 100 + 'vw';
      glitter.style.animationDuration = (Math.random() * 4 + 4) + 's, ' + (Math.random() * 1.5 + 0.8) + 's';
      glitter.style.animationDelay = (Math.random() * 5) + 's, ' + (Math.random() * 2) + 's';
      document.body.appendChild(glitter);
    }

    function showPasscodeScreen() {
      const greetingBox = document.getElementById('greetingBox');
      const passcodeBox = document.getElementById('passcodeBox');

      greetingBox.style.opacity = '0';
      greetingBox.style.transform = 'scale(0.9)';

      setTimeout(() => {
        greetingBox.style.display = 'none';
        passcodeBox.style.display = 'flex';
        setTimeout(() => {
          passcodeBox.style.opacity = '1';
        }, 50);
      }, 400);
    }

    function pressKey(num) {
      if (enteredCode.length < 6) {
        enteredCode += num;
        updateDots();

        if (enteredCode.length === 6) {
          setTimeout(verifyPasscode, 200);
        }
      }
    }

    function deleteKey() {
      if (enteredCode.length > 0) {
        enteredCode = enteredCode.slice(0, -1);
        updateDots();
        document.getElementById('statusMsg').innerText = "";
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, index) => {
        if (index < enteredCode.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    function verifyPasscode() {
      const container = document.getElementById('mainContainer');
      const statusMsg = document.getElementById('statusMsg');

      if (enteredCode === CORRECT_PASSCODE) {
        statusMsg.style.color = "#2e7d32";
        statusMsg.innerText = "Success!";
        
        // Redirect to HBD.html on correct code
        setTimeout(() => {
          window.location.href = "HBD.html";
        }, 500);
      } else {
        container.classList.add('shake');
        statusMsg.style.color = "#e91e63";
        statusMsg.innerText = "Try again";

        setTimeout(() => {
          container.classList.remove('shake');
          enteredCode = "";
          updateDots();
        }, 500);
      }
    }
  </script>
</body>
</html>
